<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Aplikasi Pencatat Tugas Kuliah Simpel & Minimalis">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TugasKuliah">
  <title>Tugas Kuliah</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
  <div class="app">
    <!-- Header Simpel -->
    <header class="header">
      <div class="header-left">
        <h1>Tugas Kuliah</h1>
        <p id="taskCountText">Memuat tugas...</p>
      </div>
      <div class="header-right">
        <button id="themeToggleBtn" class="icon-btn" title="Ganti Tema" aria-label="Ganti Tema">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button id="menuBtn" class="icon-btn" title="Menu Cadangan" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        </button>
      </div>
    </header>

    <!-- Quick Add Input (Simpel di bagian atas) -->
    <div class="quick-add-card">
      <form id="quickAddForm">
        <div class="quick-add-row">
          <input type="text" id="quickTitleInput" placeholder="+ Tambah tugas baru..." autocomplete="off" required>
          <button type="submit" class="add-submit-btn">Tambah</button>
        </div>
        <div class="quick-add-options">
          <input type="text" id="quickCourseInput" placeholder="Mata Kuliah (opsional)" list="courseList">
          <datalist id="courseList"></datalist>
          <input type="date" id="quickDateInput" title="Batas Waktu">
        </div>
      </form>
    </div>

    <!-- Filter Tab Simpel -->
    <div class="filter-bar">
      <div class="segmented-control" id="filterTabs">
        <button class="seg-btn active" data-filter="aktif">Belum Selesai</button>
        <button class="seg-btn" data-filter="selesai">Selesai</button>
        <button class="seg-btn" data-filter="semua">Semua</button>
      </div>
    </div>

    <!-- Daftar Tugas -->
    <main class="main-content">
      <div id="taskList" class="task-list">
        <!-- Rendered by JavaScript -->
      </div>

      <!-- State Kosong Bersih -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <p id="emptyText">Tidak ada tugas. Bersih & santai! ☕</p>
      </div>
    </main>

    <!-- Modal Menu Ringkas (Backup / Export) -->
    <div id="menuModal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Menu & Cadangan</h3>
          <button id="closeMenuBtn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <button id="exportBtn" class="menu-action-btn">
            💾 Unduh Cadangan Data (JSON)
          </button>
          <label class="menu-action-btn file-upload-label">
            📥 Pulihkan Data dari File
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
          </label>
          <button id="clearAllBtn" class="menu-action-btn danger">
            🗑️ Hapus Semua Tugas
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Notifikasi</div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('ServiceWorker siap:', reg.scope))
          .catch(err => console.log('ServiceWorker error:', err));
      });
    }
  </script>
</body>
</html>
